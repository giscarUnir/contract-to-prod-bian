name: Contrato a código

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-to-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrato y compatibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Spectral
        run: npx --yes --package=@stoplight/spectral-cli@6.17.1 spectral lint --ruleset .github/spectral.yaml --fail-severity warn contracts/bian/openapi.yaml
      - name: Obtener el contrato base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "${BASE_SHA}:contracts/bian/openapi.yaml" > base-contract.yaml
      - name: Bloquear cambios incompatibles
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee # v0.2.1
        with:
          base: base-contract.yaml
          revision: contracts/bian/openapi.yaml
          fail-on: ERR
          review: 'false'

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .

  propose:
    name: Generación completa con Gemini
    needs: [contract, secrets]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      mode: ${{ steps.gemini.outputs.mode }}
      model: ${{ steps.gemini.outputs.model }}
      primary: ${{ steps.gemini.outputs.primary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: ./.github/actions/generate-service
        with:
          output: service
      - name: Generar las interfaces Jakarta REST
        run: mvn -B -ntp -f service/pom.xml generate-sources
      - name: Solicitar implementación y pruebas unitarias completas
        id: gemini
        uses: ./.github/actions/gemini
        with:
          project: service
          proposal: proposal/files.json
          api-key: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gemini.outputs.mode == 'gemini'
        with:
          name: propuesta-gemini
          path: proposal/files.json
          if-no-files-found: error
          overwrite: true

  verify:
    name: Compilación, pruebas y cobertura
    needs: [contract, secrets, propose]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      tests: ${{ steps.quality.outputs.tests }}
      unit: ${{ steps.quality.outputs.unit }}
      coverage: ${{ steps.quality.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: propuesta-gemini
          path: proposal
      - uses: ./.github/actions/generate-service
        with:
          output: service
      - name: Incorporar las capas y las pruebas generadas
        uses: ./.github/actions/apply-proposal
        with:
          project: service
          proposal: proposal/files.json
      - name: Compilar y ejecutar pruebas unitarias y de aceptación
        run: mvn -B -ntp -f service/pom.xml verify
      - name: Verificar arquitectura, pruebas, cobertura y arranque
        id: quality
        uses: ./.github/actions/verify-service
        with:
          project: service
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proyecto-validado
          path: |
            service/pom.xml
            service/LICENSE
            service/README.md
            service/src/
            service/contracts/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: calidad
          path: |
            service/target/surefire-reports/
            service/target/jacoco-report/
            service/target/bom.json
            service/target/smoke.log
          overwrite: true

  dependencies:
    name: Dependencias y SBOM
    needs: verify
    if: "!cancelled() && needs.verify.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calidad
          path: calidad
      - name: OSV-Scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source -L calidad/bom.json --format=json | tee osv-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: seguridad-dependencias
          path: osv-report.json
          overwrite: true

  delivery:
    name: Entregar microservicio verificado
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      url: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proyecto-validado
          path: current-account
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: current-account
          path: current-account/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  report:
    name: Informe del PR
    needs: [contract, secrets, propose, verify, dependencies, delivery]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.RESULTS);
            const marker = '<!-- contract-to-code -->';
            const status = { success: 'Correcto', failure: 'Falló', skipped: 'Omitido', cancelled: 'Cancelado' };
            const proposal = jobs.propose.outputs;
            const metrics = jobs.verify.outputs;
            const stages = [
              ['Spectral y compatibilidad', jobs.contract.result],
              ['Escaneo de secretos', jobs.secrets.result],
              ['Generación completa con Gemini', jobs.propose.result],
              ['Compilación, pruebas y cobertura', jobs.verify.result],
              ['Dependencias y SBOM', jobs.dependencies.result],
              ['Entrega del microservicio', jobs.delivery.result],
            ];
            const implementation = proposal.mode === 'gemini' ? `Implementación propuesta por \`${proposal.model}\``
              : proposal.mode === 'sin-clave' ? 'Falta configurar \`GEMINI_API_KEY\`. No se generó código.'
              : jobs.propose.result === 'failure' ? 'Gemini falló. No se verificó una implementación.'
              : 'Ejecución de controles del contrato. No se generó código.';
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Contrato a código',
              implementation,
              proposal.model && proposal.model !== proposal.primary ? `Modelo de respaldo. Principal: \`${proposal.primary}\`.` : '',
              '',
              '| Control | Resultado |',
              '| --- | --- |',
              ...stages.map(([label, result]) => `| ${label} | ${status[result]} |`),
              '',
              metrics.tests ? `Pruebas unitarias: **${metrics.unit}**. Pruebas HTTP: **${metrics.tests}**. Cobertura de dominio y aplicación: **${metrics.coverage}**.` : '',
              jobs.delivery.outputs.url ? `[Descargar microservicio y pruebas](${jobs.delivery.outputs.url})` : '',
              `[Ver ejecución y evidencias](${run})`,
            ].join('\n');
            await core.summary.addRaw(body, true).write();

            const pr = context.payload.pull_request;
            if (!pr || pr.head.repo.full_name !== process.env.GITHUB_REPOSITORY) return;
            const params = { ...context.repo, issue_number: pr.number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...params, body });
