name: Contrato a código

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sandbox_run_id:
        description: ID de una corrida con distribución validada. Si se indica, solo se prueba Kubernetes.
        type: string
      sandbox_attempt:
        description: Intento que produjo el artefacto de distribución.
        type: choice
        default: inicial
        options:
          - inicial
          - correccion
          - segunda-correccion

permissions:
  contents: read

concurrency:
  group: contract-to-code-${{ github.ref }}-${{ inputs.sandbox_run_id && 'sandbox' || 'completo' }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrato y compatibilidad
    if: "!inputs.sandbox_run_id"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Spectral
        run: npx --yes --package=@stoplight/spectral-cli@6.17.1 spectral lint --ruleset .github/spectral.yaml --fail-severity warn contracts/bian/openapi.yaml
      - name: Obtener el contrato base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "${BASE_SHA}:contracts/bian/openapi.yaml" > base-contract.yaml
      - name: Bloquear cambios incompatibles
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee # v0.2.1
        with:
          base: base-contract.yaml
          revision: contracts/bian/openapi.yaml
          fail-on: ERR
          review: 'false'

  secrets:
    name: Escaneo de secretos
    if: "!inputs.sandbox_run_id"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all --gitleaks-ignore-path .github/gitleaks.ignore .

  fortify_config:
    name: Configuración de Fortify
    if: >-
      !inputs.sandbox_run_id &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar la configuración de Fortify on Demand
        shell: bash
        env:
          FOD_URL: ${{ vars.FOD_URL }}
          FOD_RELEASE: ${{ vars.FOD_RELEASE }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
        run: |
          for setting in FOD_URL FOD_RELEASE FOD_CLIENT_ID FOD_CLIENT_SECRET; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Falta configurar $setting para Fortify on Demand."
              missing=1
            fi
          done
          exit "${missing:-0}"

  propose:
    name: Generación completa con Gemini
    needs: [contract, secrets, fortify_config]
    uses: ./.github/workflows/gemini-proposal.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  verify:
    name: Evaluar la propuesta inicial
    needs: propose
    uses: ./.github/workflows/verify-proposal.yml
    with:
      attempt: inicial
      proposal: propuesta-gemini

  repair:
    name: Ajustar la implementación con Gemini
    needs: verify
    if: needs.verify.outputs.valid == 'false'
    uses: ./.github/workflows/gemini-proposal.yml
    with:
      repair-from: inicial
      artifact: propuesta-corregida
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  verify_repair:
    name: Verificar la implementación ajustada
    needs: repair
    uses: ./.github/workflows/verify-proposal.yml
    with:
      attempt: correccion
      proposal: propuesta-corregida

  repair_again:
    name: Ajuste final de la implementación con Gemini
    needs: verify_repair
    if: needs.verify_repair.outputs.valid == 'false'
    uses: ./.github/workflows/gemini-proposal.yml
    with:
      repair-from: correccion
      previous: propuesta-corregida
      artifact: propuesta-corregida-final
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  verify_again:
    name: Verificar el ajuste final
    needs: repair_again
    uses: ./.github/workflows/verify-proposal.yml
    with:
      attempt: segunda-correccion
      proposal: propuesta-corregida-final

  validated:
    name: Validar el resultado final
    needs: [propose, verify, repair, verify_repair, repair_again, verify_again]
    if: "!cancelled() && needs.propose.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      attempt: ${{ steps.select.outputs.attempt }}
    steps:
      - name: Seleccionar la propuesta que pasó los controles
        id: select
        shell: bash
        env:
          FIRST: ${{ needs.verify.result == 'success' && needs.verify.outputs.valid == 'true' }}
          REPAIRED: ${{ needs.verify_repair.result == 'success' && needs.verify_repair.outputs.valid == 'true' }}
          REPAIRED_AGAIN: ${{ needs.verify_again.result == 'success' && needs.verify_again.outputs.valid == 'true' }}
        run: |
          if [[ "$FIRST" == true ]]; then
            echo 'attempt=inicial' >> "$GITHUB_OUTPUT"
          elif [[ "$REPAIRED" == true ]]; then
            echo 'attempt=correccion' >> "$GITHUB_OUTPUT"
          elif [[ "$REPAIRED_AGAIN" == true ]]; then
            echo 'attempt=segunda-correccion' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Ninguna propuesta pasó todos los controles. Consulta el diagnóstico de cada intento.'
            exit 1
          fi

  dependencies:
    name: Dependencias y SBOM
    needs: validated
    if: "!cancelled() && needs.validated.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calidad-${{ needs.validated.outputs.attempt }}
          path: calidad
      - name: OSV-Scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source -L calidad/bom.json --format=json | tee osv-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: seguridad-dependencias
          path: osv-report.json
          overwrite: true

  fortify:
    name: Fortify SAST y política de seguridad
    needs: validated
    if: "!cancelled() && needs.validated.result == 'success'"
    concurrency:
      group: fortify-fod-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proyecto-validado-${{ needs.validated.outputs.attempt }}
          path: current-account
      - uses: fortify/github-action/setup@0540f6aefd95d12a5fbed40f406d825fad64330e # v3.1.1
        with:
          fcli: '3.30.0'
          sc-client: '26.2.1'
      - name: Preparar las fuentes y dependencias para el escaneo
        shell: bash
        run: |
          mvn -B -ntp -f current-account/pom.xml generate-sources
          fcli tool sc-client run --workdir "$PWD/current-account" --version 26.2.1 -- \
            package --build-tool mvn --output "$RUNNER_TEMP/fortify.zip"
          unzip -tq "$RUNNER_TEMP/fortify.zip"
      - name: Ejecutar SAST y exigir que se cumpla la política de Fortify
        shell: bash
        env:
          FOD_URL: ${{ vars.FOD_URL }}
          FOD_RELEASE: ${{ vars.FOD_RELEASE }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          DO_SETUP: 'false'
          DO_SAST_SCAN: 'true'
          DO_WAIT: 'true'
          DO_CHECK_POLICY: 'true'
          DO_SAST_EXPORT: 'false'
          DO_PR_COMMENT: 'false'
          DO_AVIATOR_REMEDIATIONS: 'false'
        run: USE_PACKAGE="$RUNNER_TEMP/fortify.zip" fcli action run ci

  kubernetes:
    name: Despliegue y pruebas HTTP en Kubernetes
    needs: validated
    if: "!cancelled() && needs.validated.result == 'success'"
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/kubernetes.yml
    with:
      attempt: ${{ needs.validated.outputs.attempt }}

  sandbox:
    name: Prueba rápida en Kubernetes
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/kubernetes.yml
    with:
      attempt: ${{ inputs.sandbox_attempt }}
      source-run: ${{ inputs.sandbox_run_id }}

  delivery:
    name: Entregar microservicio verificado
    needs: [validated, dependencies, fortify, kubernetes]
    if: >-
      !cancelled() && needs.validated.result == 'success' && needs.dependencies.result == 'success'
      && needs.fortify.result == 'success' && needs.kubernetes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      url: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proyecto-validado-${{ needs.validated.outputs.attempt }}
          path: current-account
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: current-account
          path: current-account/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  report:
    name: Informe del PR
    needs: [contract, secrets, fortify_config, propose, verify, repair, verify_repair, repair_again, verify_again, validated, dependencies, fortify, kubernetes, delivery]
    if: always() && !cancelled() && !inputs.sandbox_run_id
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const jobs = JSON.parse(process.env.RESULTS);
            const marker = '<!-- contract-to-code -->';
            const status = { success: 'Correcto', failure: 'Falló', skipped: 'Omitido', cancelled: 'Cancelado' };
            const proposal = jobs.propose.outputs;
            const repair = jobs.repair.outputs;
            const lastRepair = jobs.repair_again.outputs;
            const attempt = jobs.validated.outputs.attempt;
            const attempts = { inicial: jobs.verify, correccion: jobs.verify_repair, 'segunda-correccion': jobs.verify_again };
            const metrics = attempts[attempt]?.outputs ?? {};
            const verification = job => job.result === 'success' && job.outputs.valid !== 'true' ? 'failure' : job.result;
            const stages = [
              ['Spectral y compatibilidad', jobs.contract.result],
              ['Escaneo de secretos', jobs.secrets.result],
              ['Configuración de Fortify', jobs.fortify_config.result],
              ['Generación completa con Gemini', jobs.propose.result],
              ['Evaluación de la propuesta inicial', verification(jobs.verify)],
              ['Ajuste de la implementación con Gemini', jobs.repair.result],
              ['Verificación de la implementación ajustada', verification(jobs.verify_repair)],
              ['Ajuste final de la implementación con Gemini', jobs.repair_again.result],
              ['Verificación del ajuste final', verification(jobs.verify_again)],
              ['Validación final', jobs.validated.result],
              ['Dependencias y SBOM', jobs.dependencies.result],
              ['Fortify SAST y política de seguridad', jobs.fortify.result],
              ['Despliegue y pruebas HTTP dentro de Kubernetes', jobs.kubernetes.result],
              ['Entrega del microservicio', jobs.delivery.result],
            ];
            const implementation = proposal.mode === 'gemini' ? `Implementación propuesta por \`${proposal.model}\``
              : proposal.mode === 'sin-clave' ? 'Falta configurar \`GEMINI_API_KEY\`. No se generó código.'
              : jobs.propose.result === 'failure' ? 'Gemini falló. No se verificó una implementación.'
              : 'Ejecución de controles del contrato. No se generó código.';
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Contrato a código',
              implementation,
              proposal.model && proposal.model !== proposal.primary ? `Modelo de respaldo. Principal: \`${proposal.primary}\`.` : '',
              repair.model ? `Modelo del ajuste: \`${repair.model}\`.` : '',
              lastRepair.model ? `Modelo del ajuste final: \`${lastRepair.model}\`.` : '',
              '',
              '| Control | Resultado |',
              '| --- | --- |',
              ...stages.map(([label, result]) => `| ${label} | ${status[result]} |`),
              '',
              attempt && metrics.tests ? `Pruebas unitarias: **${metrics.unit}**. Pruebas HTTP: **${metrics.tests}**. Cobertura de dominio y aplicación: **${metrics.coverage}**.` : '',
              jobs.delivery.outputs.url ? `[Descargar microservicio y pruebas](${jobs.delivery.outputs.url})` : '',
              `[Ver ejecución y evidencias](${run})`,
            ].join('\n');
            await core.summary.addRaw(body, true).write();

            const pr = context.payload.pull_request;
            if (!pr || pr.head.repo.full_name !== process.env.GITHUB_REPOSITORY) return;
            const params = { ...context.repo, issue_number: pr.number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...params, body });
